# Builds the website version of TabMaker and publishes it with GitHub Pages.
# Because ekremturanfirat.github.io uses the custom domain ekremturanfirat.com,
# this repo's Pages site is served at https://ekremturanfirat.com/TabMaker/
name: Deploy TabMaker to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Build and deploy are separate jobs (as in GitHub's own Pages template): when the deploy
# step ran right after the upload in the same job, it sometimes asked for the site a
# fraction of a second too early, found "0 artifacts" and failed.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build the website copy
        working-directory: app
        run: node tools/build-site.mjs ../_site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
